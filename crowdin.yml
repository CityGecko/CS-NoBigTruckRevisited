# Crowdin configuration for No Big Truck Revisited (used by the Crowdin GitHub integration and the Crowdin CLI).
# Source: English texts in NoBigTruck/Translations/en-EN.csv ("KEY","text" per line, AlgernonCommons format).
# Translations: one file per language, same format, named by the Crowdin locale code (de-DE.csv, uk-UA.csv, ...).
files:
  - source: /NoBigTruck/Translations/en-EN.csv
    translation: /NoBigTruck/Translations/%locale%.csv
    # Column 1 = key, column 2 = text. In the language files column 2 is the translation.
    scheme: "identifier,source_phrase"
    first_line_contains_header: false
    # Untranslated texts are left out, so the mod falls back to English for them.
    skip_untranslated_strings: true
    update_option: update_as_unapproved
